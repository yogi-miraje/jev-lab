[project]
name = "jev-lab"
version = "0.2.0"
description = "Small Python experiment for TypeSafe Jev"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.1",
  "typesafe-sdk>=0.1.0",
]

[project.scripts]
jev-route = "jev_lab.model_router.cli:main"
jev-route-benchmark = "jev_lab.model_router.benchmark:main"
jev-semantic-layer = "jev_lab.financial_semantic_layer.layer_cli:main"
jev-semantic-layer-benchmark = "jev_lab.financial_semantic_layer.layer_benchmark:main"
jev-semantic-date-benchmark = "jev_lab.financial_semantic_layer.date_benchmark:main"
jev-semantic-repeatability = "jev_lab.financial_semantic_layer.repeatability_benchmark:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
